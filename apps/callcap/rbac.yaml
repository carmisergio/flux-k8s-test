# The controller manages recorder Jobs in its own namespace, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: callcap-controller
  namespace: callcap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: callcap-controller
  namespace: callcap
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # patch: failing sessions that cannot be scheduled (schedule_timeout_secs)
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Per-session Secret with the agent token (owned by, and deleted with,
  # the session's Job).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: callcap-controller
  namespace: callcap
subjects:
  - kind: ServiceAccount
    name: callcap-controller
    namespace: callcap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: callcap-controller
