# callcap: records calls in browser pods (github.com/swarm-laboratories/callcap).
#
# namespace, rbac, controller, networkpolicy and recorder-egress.yaml are
# copied unchanged from the callcap repo at v0.1.0 (deploy/k8s, and
# deploy/k8s/optional for recorder-egress). What's specific to this cluster
# is in this file and controller.toml, so upgrading is: copy those files
# again from the new tag, then bump the tag here and recorder_image in
# controller.toml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: callcap
resources:
  - namespace.yaml
  - rbac.yaml
  - controller.yaml
  - networkpolicy.yaml
  - recorder-egress.yaml
  - callcap-api.sops.yaml
  - callcap-upload.sops.yaml
  - secret-ghcr-login.sops.yaml
  - volsync-secret.sops.yaml
  - volsync.yaml
configMapGenerator:
  - name: callcap-controller
    files:
      - controller.toml
images:
  - name: callcap-controller
    newName: ghcr.io/swarm-laboratories/callcap-controller
    newTag: v0.0.3
patches:
  # The GHCR packages are private. (Recorder pods get the same secret
  # through image_pull_secrets in controller.toml.)
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: callcap-controller
        namespace: callcap
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-login
  # Pinned here so a new upstream tag can't change who owns the profiles:
  # must match moverSecurityContext in volsync.yaml.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: callcap-controller
        namespace: callcap
      spec:
        template:
          spec:
            securityContext:
              runAsUser: 65532
              runAsGroup: 65532
              fsGroup: 65532
  # Replicated, so the controller isn't tied to one node's disk.
  - target: { kind: PersistentVolumeClaim, name: callcap-profiles }
    patch: |
      - op: add
        path: /spec/storageClassName
        value: mayastor-2
      # Populated from the latest VolSync restore (volsync.yaml) when the
      # PVC is created, so a recreated namespace comes back with its data.
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: volsync.backube
          kind: ReplicationDestination
          name: callcap
  # A fixed LAN address from Cilium's `static` pool, announced over BGP.
  - target: { kind: Service, name: callcap-controller }
    patch: |
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/labels
        value:
          lb.home/static: "true"
      - op: add
        path: /metadata/annotations
        value:
          lbipam.cilium.io/ips: 192.168.201.10
