# callcap-controller configuration.

recorder_image = "ghcr.io/swarm-laboratories/callcap-recorder:v0.0.2"
image_pull_secrets = ["ghcr-login"]   # secret-ghcr-login.sops.yaml

[upload]
backend = "drive"
secret = "callcap-upload"   # callcap-upload.sops.yaml: credentials.json

[upload.drive]
folder_id = "1HwsgILYzHdIKwrdcrDjMHr5-ohAgzbow"

# The controller is served over plain HTTP on its LoadBalancer IP: a Secure
# cookie would never be sent back, and logins would silently fail.
[web]
cookie_secure = false

# Web UI users. `callcap hash-password <name>` prints this block.
[[users]]
name = "leviathan"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$zCc5TSsmoZvaER8chUs+Ow$Tai6RnS+5RduBvtsZjpdgDHh6Dgl3w6yV1Y2rO/BXOk"

# Saved browser logins, on the controller's volume. Unset = no profiles.
[profiles]
dir = "/var/lib/callcap/profiles"
