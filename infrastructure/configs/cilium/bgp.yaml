# eBGP peering between every node (AS 64513) and OPNsense (AS 64512)
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: opnsense
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cluster
      localASN: 64513
      peers:
        - name: opnsense
          peerASN: 64512
          peerAddress: 192.168.200.1
          peerConfigRef:
            name: opnsense
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: opnsense
spec:
  # Keep the routes on the router while a node's agent restarts.
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: loadbalancer-ips
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      # Match every service
      selector:
        matchExpressions:
          - key: somekey
            operator: NotIn
            values: ["never-used-value"]
