# Replicated volumes (2 copies)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mayastor-2
provisioner: io.openebs.csi-mayastor
allowVolumeExpansion: true
parameters:
  protocol: nvmf
  repl: "2"
---
# Node-local volumes: a ZFS dataset per volume under zroot/openebs-localpv
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-local
provisioner: zfs.csi.openebs.io
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  poolname: zroot/openebs-localpv
  fstype: zfs
  thinprovision: "yes"
