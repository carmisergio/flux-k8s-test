# Replicated volumes: one copy on each of the two Mayastor pools (cp1, cp3).
# Survives the loss of one of them.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mayastor-2
provisioner: io.openebs.csi-mayastor
allowVolumeExpansion: true
parameters:
  protocol: nvmf
  repl: "2"
---
# Node-local volumes: a ZFS dataset per volume under zroot/openebs-localpv. The
# pod is bound to the node its volume is on. thinprovision "no": each volume
# reserves its size, so volumes can't take the space of the system or k3s.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-local
provisioner: zfs.csi.openebs.io
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  poolname: zroot/openebs-localpv
  fstype: zfs
  thinprovision: "no"
