apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
spec:
  releaseName: netbird
  interval: 24h
  chart:
    spec:
      chart: netbird-operator
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: netbirdio
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
