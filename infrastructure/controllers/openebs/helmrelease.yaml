apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Must be "openebs": Mayastor's etcd is stored under
  # /var/local/<release>/localpv-hostpath/etcd, which is the zroot/mayastor-etcd
  # dataset only for this name.
  name: openebs
  namespace: openebs-system
spec:
  interval: 1h
  timeout: 15m
  # The io-engine DaemonSet uses the OnDelete update strategy, which the
  # default kstatus poller waits on forever. Helm v3's waiter skips it.
  waitStrategy:
    name: legacy
  chart:
    spec:
      chart: openebs
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: openebs
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: true
        # hostpath stays: used for mayastor's etcd
      replicated:
        mayastor:
          enabled: true
    localpv-provisioner:
      hostpathClass:
        enabled: false
    zfs-localpv:
      zfs:
        # nix zfs tools location
        bin: /run/booted-system/sw/bin/zfs
    mayastor:
      io_engine:
        # One core per io-engine instead of two (CPU request and limit follow).
        cpuCount: "1"
        interruptMode:
          enabled: true
      obs:
        # No usage reports to OpenEBS.
        callhome:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
