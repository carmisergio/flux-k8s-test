apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Must be "openebs": Mayastor's etcd is stored under
  # /var/local/<release>/localpv-hostpath/etcd, which is the zroot/mayastor-etcd
  # dataset only for this name.
  name: openebs
  namespace: openebs-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: openebs
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: openebs
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: true
        # hostpath stays: used for mayastor's etcd
      replicated:
        mayastor:
          enabled: true
    localpv-provisioner:
      hostpathClass:
        enabled: false
    zfs-localpv:
      zfs:
        # nix zfs tools location
        bin: /run/booted-system/sw/bin/zfs
    loki:
      enabled: false
    alloy:
      enabled: false
