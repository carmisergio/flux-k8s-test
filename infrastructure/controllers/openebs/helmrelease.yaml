# OpenEBS: Mayastor (replicated volumes on the nodes' Mayastor partitions) and
# ZFS LocalPV (node-local volumes in zroot/openebs-localpv).
#
# The node side is in nix-k8s-test: the Mayastor partitions, huge pages,
# nvme_tcp and the openebs.io/engine=mayastor label (modules/mayastor.nix), and
# the datasets zroot/mayastor-etcd and zroot/openebs-localpv (modules/disk.nix).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Must be "openebs": Mayastor's etcd is stored under
  # /var/local/<release>/localpv-hostpath/etcd, which is the zroot/mayastor-etcd
  # dataset only for this name.
  name: openebs
  namespace: openebs-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: openebs
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: openebs
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: true
        # hostpath stays: Mayastor's etcd uses it.
      replicated:
        mayastor:
          enabled: true
    # Hostpath volumes would be on the nodes' root dataset, without a size
    # limit. Node-local volumes use ZFS LocalPV instead. The hostpath
    # provisioner itself stays, for Mayastor's etcd.
    localpv-provisioner:
      hostpathClass:
        enabled: false
    zfs-localpv:
      zfs:
        # The driver runs the host's zfs with chroot; NixOS has no /sbin/zfs.
        # The booted system's zfs matches the loaded kernel module, also after
        # a deploy that updates ZFS but before the reboot.
        bin: /run/booted-system/sw/bin/zfs
    loki:
      enabled: false
    alloy:
      enabled: false
