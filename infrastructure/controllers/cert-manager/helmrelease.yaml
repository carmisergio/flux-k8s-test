apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  releaseName: cert-manager
  interval: 24h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
    podDnsPolicy: "None"
    podDnsConfig:
      nameservers:
        - 1.1.1.1
        - 8.8.8.8


